services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fusion
      POSTGRES_PASSWORD: fusion
      POSTGRES_DB: fusion
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion -d fusion"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - fusion-postgres:/var/lib/postgresql/data

  # `docker compose up` is the whole application: this image migrates, seeds,
  # and then serves both the API and the built SPA on one origin.
  #
  # `docker compose up -d postgres` still starts only the database, because
  # naming a service explicitly overrides the default set — so the local
  # `npm run dev` workflow is unchanged.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fusion:fusion@postgres:5432/fusion?schema=public
      PORT: 3001
      # The API serves the SPA, so there is a single origin and CORS never fires.
      FRONTEND_ORIGIN: http://localhost:3001
      SPA_DIR: /repo/frontend/dist
      # The demo is reached over plain http://localhost, where a Secure cookie
      # is dropped by some browsers and login fails silently. Anything
      # terminating TLS must leave this unset.
      SESSION_COOKIE_SECURE: "false"
      # Applied by the entrypoint before the server starts.
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
      # Swagger UI describes the whole API surface, so production must ask.
      ENABLE_API_DOCS: "false"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    # The server drains its SSE streams on SIGTERM; give it room to finish.
    stop_grace_period: 15s

volumes:
  fusion-postgres:
